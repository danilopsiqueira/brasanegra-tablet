[build]
  publish = "."

# Codigo e lista de paginas: sempre verificar se ha versao nova.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

# Imagens: guardadas 1 hora (uma foto trocada com o mesmo nome aparece depressa).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
