<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    >
    <meta
      name="description"
      content="Cardápio digital do restaurante Brasa Negra, otimizado para tablets, telemóveis e computadores."
    >
    <meta name="robots" content="index,follow">
    <meta name="theme-color" content="#050403">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Brasa Negra">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="pt_PT">
    <meta property="og:title" content="Cardápio Brasa Negra">
    <meta property="og:description" content="Cardápio digital do restaurante Brasa Negra.">
    <meta property="og:url" content="https://cardapio.brasanegra.pt/">
    <meta property="og:image" content="https://cardapio.brasanegra.pt/assets/inicio-20260824.jpg">
    <link rel="canonical" href="https://cardapio.brasanegra.pt/">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icons/icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="assets/icons/icon-512.png">
    <link rel="preload" href="assets/inicio-20260824.jpg" as="image">
    <title>Brasa Negra | Cardápio Digital</title>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="app" aria-label="Cardápio digital Brasa Negra">
      <!-- Ecra de boas-vindas -->
      <section id="welcome" class="screen welcome is-active" aria-label="Boas-vindas">
        <div class="welcome__bg" aria-hidden="true"></div>
        <canvas id="embers" class="welcome__embers" aria-hidden="true"></canvas>
        <img class="welcome__poster" src="assets/inicio-20260824.jpg" alt="Seja bem-vindo ao Brasa Negra">
        <button class="welcome__start" type="button" data-action="start">
          Toque para ver o cardápio
        </button>
      </section>

      <!-- Inicio: categorias -->
      <section id="home" class="screen home" aria-label="Categorias">
        <header class="topbar">
          <button class="brand" type="button" data-action="welcome" aria-label="Ecrã de boas-vindas">
            <span class="brand__name">Brasa Negra</span>
            <span class="brand__sub">by Touro e Fogo</span>
          </button>
          <div class="topbar__actions">
            <button class="pill-button" type="button" data-action="open-list">
              <span class="heart" aria-hidden="true"></span>
              <span class="pill-button__label">A minha escolha</span>
              <span class="count-badge" data-count hidden></span>
            </button>
            <button class="icon-button" type="button" data-action="fullscreen" aria-label="Ecrã inteiro" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" /></svg>
            </button>
          </div>
        </header>
        <div class="home__scroll scroll-area">
          <section class="hero">
            <div class="hero__text">
              <p class="hero__eyebrow">Brasa Negra · by Touro e Fogo</p>
              <h1 class="hero__title">Da brasa<br>para a sua mesa</h1>
              <p class="hero__sub">Cortes suculentos, grelhados na brasa e servidos a fumegar.</p>
              <button class="hero__cta" type="button" data-action="open-carnes">
                Ver as carnes
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
              </button>
            </div>
            <div class="hero__photo">
              <img src="assets/capas/destaque.webp" alt="Costeletão grelhado na brasa, cortado em fatias">
            </div>
          </section>

          <section class="featured" aria-labelledby="featured-title">
            <div class="block-head">
              <h2 class="block-title" id="featured-title">Saídos da brasa</h2>
              <p class="block-sub">Deslize para ver mais</p>
            </div>
            <div id="featured-row" class="featured__row"></div>
          </section>

          <div class="block-head">
            <h2 class="block-title">O que lhe apetece hoje?</h2>
          </div>
          <div id="category-grid" class="category-grid"></div>
        </div>
      </section>

      <!-- Categoria: pratos -->
      <section id="category" class="screen category" aria-label="Pratos">
        <header class="topbar topbar--category">
          <button class="back-button" type="button" data-action="home">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
            Início
          </button>
          <nav id="tabs" class="tabs" aria-label="Categorias"></nav>
          <div class="topbar__actions">
            <button class="pill-button" type="button" data-action="open-list">
              <span class="heart" aria-hidden="true"></span>
              <span class="pill-button__label">A minha escolha</span>
              <span class="count-badge" data-count hidden></span>
            </button>
          </div>
        </header>
        <div id="category-scroll" class="category__scroll scroll-area">
          <div id="category-content" class="category__content"></div>
        </div>
      </section>

      <!-- Barra "A minha escolha" -->
      <button id="list-bar" class="list-bar" type="button" data-action="open-list" hidden>
        <span class="heart" aria-hidden="true"></span>
        <span class="list-bar__text">A minha escolha</span>
        <span class="list-bar__count" id="list-bar-count"></span>
        <span class="list-bar__total" id="list-bar-total"></span>
        <span class="list-bar__cta">Ver</span>
      </button>

      <!-- Detalhe do prato -->
      <div id="detail" class="overlay" hidden>
        <div class="overlay__backdrop" data-action="close-detail"></div>
        <article class="detail" role="dialog" aria-modal="true" aria-labelledby="detail-name">
          <button class="close-button" type="button" data-action="close-detail" aria-label="Fechar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
          <div class="detail__media" id="detail-media"></div>
          <div class="detail__info">
            <p class="detail__section" id="detail-section"></p>
            <h2 class="detail__name" id="detail-name"></h2>
            <p class="detail__price" id="detail-price"></p>
            <p class="detail__desc" id="detail-desc"></p>
            <p class="detail__note" id="detail-note"></p>
            <div class="pairing" id="detail-pairing" hidden></div>
            <div class="detail__actions" id="detail-actions"></div>
            <p class="detail__position" id="detail-position"></p>
          </div>
          <button class="detail__nav detail__nav--prev" type="button" data-action="detail-prev" aria-label="Prato anterior">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
          </button>
          <button class="detail__nav detail__nav--next" type="button" data-action="detail-next" aria-label="Próximo prato">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
          </button>
        </article>
      </div>

      <!-- A minha escolha -->
      <div id="list" class="overlay overlay--side" hidden>
        <div class="overlay__backdrop" data-action="close-list"></div>
        <aside class="list-panel" role="dialog" aria-modal="true" aria-labelledby="list-title">
          <header class="list-panel__head">
            <h2 id="list-title">A minha escolha</h2>
            <button class="close-button close-button--inline" type="button" data-action="close-list" aria-label="Fechar">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
            </button>
          </header>
          <div id="list-items" class="list-panel__items scroll-area"></div>
          <footer class="list-panel__foot" id="list-foot"></footer>
        </aside>
      </div>

      <!-- Avaliacao -->
      <div id="review" class="overlay" hidden>
        <div class="overlay__backdrop" data-action="close-review"></div>
        <div class="review" role="dialog" aria-modal="true" aria-label="Avalie-nos">
          <button class="close-button" type="button" data-action="close-review" aria-label="Fechar">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" /></svg>
          </button>
          <img id="review-image" alt="Avalie-nos e ganhe um brigadeiro: aponte a câmara para o código QR">
        </div>
      </div>

      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </main>

    <script src="menu-data.js"></script>
    <script src="script.js"></script>
  </body>
</html>
